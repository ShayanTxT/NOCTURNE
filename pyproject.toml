[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nocturne"
version = "2.0.0"
description = "The hacker's terminal music player — Mr. Robot vibes, live spectrum & waveform seeking. 100% offline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nocturne contributors" }]
keywords = ["music", "player", "terminal", "tui", "audio", "flac", "spectrum", "visualizer", "hacker", "mr-robot"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "textual>=1.0",
    "soundfile>=0.12.1",
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "mutagen>=1.46",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nocturne = "nocturne.cli:main"

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/nocturne"
Repository = "https://github.com/YOUR_USERNAME/nocturne"

[tool.setuptools.packages.find]
include = ["nocturne*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
